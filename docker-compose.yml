services:
  app:
    build: .
    image: agentic-lightweight-consensus:latest
    working_dir: /workspace
    volumes:
      - ./data:/workspace/data
      - ./results:/workspace/results
      - ./paper:/workspace/paper
    env_file:
      - .env.example
    command: make test

  app-gpu:
    build: .
    image: agentic-lightweight-consensus:latest
    profiles: ["gpu"]
    working_dir: /workspace
    volumes:
      - ./data:/workspace/data
      - ./results:/workspace/results
      - ./paper:/workspace/paper
    env_file:
      - .env.example
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    command: make check-hardware
