enabled: true
mode: langgraph_vllm
primary_model: google/gemma-4-12B-it
fallback_models:
  - google/gemma-4-E4B-it
  - google/gemma-4-E2B-it
  - Qwen/Qwen3-8B
  - Qwen/Qwen3-14B
  - Qwen/Qwen3-32B
base_url: http://127.0.0.1:8000/v1
api_key_env: LLM_API_KEY
timeout_seconds: 30
serve_command:
  - vllm
  - serve
  - google/gemma-4-12B-it
  - --dtype
  - bfloat16
  - --gpu-memory-utilization
  - "0.85"
  - --max-model-len
  - "32768"
  - --enable-auto-tool-choice
  - --tool-call-parser
  - gemma4
